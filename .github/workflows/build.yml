name: Bitcoin order App

on:
  push:
    branches:
      - githubcicd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitcoin-order-pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}

      # Angular 13 requires this legacy runtime. Action runtimes are independent.
      - name: Use Node.js 16.20.2
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          output-file: 'false'
          skip-git-pull: 'true'
          skip-version-file: 'true'
          skip-commit: 'true'

      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              body: process.env.RELEASE_NOTES
            });

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.WORKSHOP6_GITHUB_TOKEN }}
        run: npm run deploy -- --no-build --name='github-actions[bot]' --email='41898282+github-actions[bot]@users.noreply.github.com'
